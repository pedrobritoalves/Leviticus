name: Leviticus checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: backend
      - run: node --test scripts/deploy-config.test.mjs
      - run: npm run check && npm test
        working-directory: backend
      - run: backend/node_modules/.bin/firebase emulators:exec --only firestore --project demo-leviticus 'node --test backend/integration/firestore.test.js'
      - name: Auth, Functions and Firestore end-to-end
        run: backend/node_modules/.bin/firebase emulators:exec --only auth,firestore,functions --project demo-leviticus 'node --test backend/e2e/callable.test.js'
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build web --release -t lib/main.dart
        working-directory: app
      - run: flutter build web --release -t lib/firebase_main.dart --dart-define-from-file=config/emulators.json --output build/firebase-check
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: leviticus-demo-web
          path: app/build/web
